<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamLens — Java 8 Stream Explainer</title>

<style>
:root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #9399a8;
    --accent: #5fb3ff;
    --good: #5fd08a;
    --warn: #f0a858;
    --line-active: rgba(95, 179, 255, 0.18);
    color-scheme: dark;
}

body.light-theme {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --border: #d9dee8;
    --text: #202633;
    --muted: #667085;
    --accent: #1769aa;
    --good: #16834b;
    --warn: #a85b12;
    --line-active: rgba(23, 105, 170, 0.12);
    color-scheme: light;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    transition: background .18s ease, color .18s ease;
}

header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

header h1 {
    margin: 0;
    font-size: 20px;
}

header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
}

main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px;
    max-width: 1600px;
    margin: 0 auto;
    align-items: start;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    min-height: 420px;
}

/* Keep the code and controls visible while explanation scrolls. */
main > .panel:first-child {
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
}

/* Scroll explanation inside its own panel. */
main > .panel:last-child {
    height: calc(100vh - 32px);
    min-height: 420px;
    overflow-y: auto;
    scroll-behavior: smooth;
}

@media (max-width: 900px) {
    main {
        grid-template-columns: 1fr;
    }

    main > .panel:first-child {
        position: static;
        max-height: none;
        overflow: visible;
    }

    main > .panel:last-child {
        height: auto;
        max-height: 75vh;
        min-height: 420px;
    }
}

textarea {
    width: 100%;
    height: 320px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    resize: vertical;
}

.code-view {
    width: 100%;
    max-height: 420px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
}

.code-view .line {
    display: flex;
    padding: 0 12px;
    white-space: pre;
    transition: background 0.15s;
}

.code-view .line .ln {
    width: 34px;
    flex-shrink: 0;
    color: var(--muted);
    user-select: none;
    text-align: right;
    margin-right: 14px;
}

.code-view .line.active {
    background: var(--line-active);
    border-left: 3px solid var(--accent);
}

.code-view .line.active .ln {
    color: var(--accent);
    font-weight: 700;
}

button {
    background: var(--accent);
    color: #0b0d12;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
}

button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 500;
    padding: 8px 14px;
}

button:disabled {
    opacity: 0.5;
    cursor: default;
}

.row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
}

#stepControls {
    display: none;
}

#stepCounter {
    color: var(--muted);
    font-size: 13px;
}

.step-row {
    scroll-margin: 18px;
}

.examples {
    font-size: 13px;
}

.examples a {
    color: var(--accent);
    cursor: pointer;
    margin-right: 10px;
}

.summary {
    background: var(--line-active);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 14px;
    font-size: 13px;
    line-height: 1.5;
}

.pipeline-section {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin: 0 0 18px;
}

.pipeline-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 10px;
    font-size: 15px;
}

.pipeline-tag {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
}

.pipeline-section .steps-flow {
    margin-top: 12px;
}

.empty-note {
    color: var(--muted);
    font-size: 13px;
}

.steps-flow {
    position: relative;
}

.step-row {
    display: flex;
    gap: 12px;
    cursor: pointer;
}

.step-marker {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.step-marker .circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    color: var(--muted);
    transition: all 0.15s;
}

.step-marker .connector {
    flex: 1;
    width: 2px;
    background: var(--border);
    margin: 2px 0;
    min-height: 14px;
}

.step-content {
    flex: 1;
    padding: 10px 12px 18px;
    border-radius: 8px;
    margin-bottom: 2px;
    transition: background 0.15s;
}

.step-row.active .step-marker .circle {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--line-active);
}

.step-row.active .step-content {
    background: var(--line-active);
}

.badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
    margin-right: 8px;
}

.badge.SOURCE {
    background: #2b3550;
    color: #9db4ff;
}

.badge.INTERMEDIATE {
    background: #2b4a3f;
    color: var(--good);
}

.badge.TERMINAL {
    background: #4a3a2b;
    color: var(--warn);
}

.op-name {
    font-family: monospace;
    font-size: 14px;
}

.desc {
    color: var(--muted);
    font-size: 13px;
    margin: 6px 0;
    line-height: 1.5;
}

.friendly {
    color: var(--text);
    font-size: 13px;
    margin: 6px 0;
    line-height: 1.5;
}

.data-row {
    font-family: monospace;
    font-size: 12.5px;
    margin: 4px 0;
    word-break: break-all;
}

.data-row .label {
    color: var(--muted);
}

pre.error {
    background: #2b1a1a;
    border: 1px solid #5a2a2a;
    color: #ffb3b3;
    padding: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
}

/* Theme toggle */
.theme-switch {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
}

.switch {
    position: relative;
    width: 48px;
    height: 24px;
    display: inline-block;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    inset: 0;
    cursor: pointer;
    background: #bbb;
    border-radius: 24px;
    transition: .3s;
}

.slider:before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: .3s;
}

.switch input:checked + .slider {
    background: #2196f3;
}

.switch input:checked + .slider:before {
    transform: translateX(24px);
}
</style>
</head>

<body>

<header>
    <div>
        <h1>StreamLens</h1>
        <p>Paste a Java 8 Stream pipeline. Get a verified, step-by-step explanation of how your data flows.</p>
    </div>

    <div class="theme-switch">
        <span>☀️</span>
        <label class="switch">
            <input
                type="checkbox"
                id="themeToggle"
                onchange="toggleTheme()"
                aria-label="Toggle dark mode"
            >
            <span class="slider"></span>
        </label>
        <span>🌙</span>
    </div>
</header>

<main>

    <div class="panel">

        <textarea id="code">List&lt;String&gt; names = Arrays.asList("Alice", "Bob", "Charlie", "Dave");
List&lt;String&gt; result = names.stream()
    .filter(n -&gt; n.length() &gt; 3)
    .map(String::toUpperCase)
    .collect(Collectors.toList());</textarea>

        <div id="codeView" class="code-view" style="display:none"></div>

<div class="examples row">
    Try:
    <a onclick="loadExample('filterMap')">filter + map</a>
    <a onclick="loadExample('sortedLimit')">sorted + limit</a>
    <a onclick="loadExample('count')">count</a>
    <a onclick="loadExample('multipleOperations')">
        Multiple operations
    </a>
</div>

        <div class="row">
            <button id="analyzeBtn" onclick="analyze()">Explain this code</button>

            <button
                id="editBtn"
                class="secondary"
                style="display:none"
                onclick="switchToEdit()"
            >Edit code</button>

            <div id="stepControls" class="row" style="margin-top:0">
                <button
                    id="prevStepBtn"
                    class="secondary"
                    onclick="prevStep()"
                >&#8592; Prev step</button>

                <button
                    id="nextStepBtn"
                    class="secondary"
                    onclick="nextStep()"
                >Next step &#8594;</button>

                <span id="stepCounter"></span>
            </div>
        </div>

    </div>

    <div class="panel">
        <div id="results">
            <p style="color: var(--muted)">Results will appear here.</p>
        </div>
    </div>

</main>

<script>

/* --------------------------------------------------
   EXAMPLES
-------------------------------------------------- */

const examples = {

    filterMap: `List<String> names = Arrays.asList("Alice", "Bob", "Charlie", "Dave");
List<String> result = names.stream()
    .filter(n -> n.length() > 3)
    .map(String::toUpperCase)
    .collect(Collectors.toList());`,

    sortedLimit: `List<Integer> nums = Arrays.asList(5, 3, 8, 1, 9, 2);
List<Integer> result = nums.stream()
    .sorted()
    .limit(3)
    .collect(Collectors.toList());`,

    count: `List<String> names = Arrays.asList("Alice", "Bob", "Charlie", "Dave");
long result = names.stream()
    .filter(n -> n.length() > 3)
    .count();`,

    multipleOperations: `List<Integer> numbers = Arrays.asList(
    10, 5, 20, 15, 30, 25, 10, 40, 35, 50,
    15, 60, 45, 70, 20, 80, 55, 90, 30, 100
);

List<Integer> result = numbers.stream()
    .filter(n -> n > 20)
    .map(n -> n * 2)
    .distinct()
    .sorted()
    .skip(2)
    .limit(4)
    .collect(Collectors.toList());

System.out.println("Final Result: " + result);`
};


/* --------------------------------------------------
   GLOBAL STATE
-------------------------------------------------- */

let currentSteps = [];
let currentStepIndex = 0;


/* --------------------------------------------------
   LOAD EXAMPLE
-------------------------------------------------- */

function loadExample(key) {
    switchToEdit();
    document.getElementById('code').value = examples[key];
}


/* --------------------------------------------------
   SWITCH BACK TO EDIT MODE
-------------------------------------------------- */

function switchToEdit() {

    document.getElementById('code').style.display = 'block';

    document.getElementById('codeView').style.display = 'none';

    document.getElementById('editBtn').style.display = 'none';

    document.getElementById('stepControls').style.display = 'none';
}


/* --------------------------------------------------
   HTML ESCAPE FUNCTION
   Fixes: escapeHtml is not defined
-------------------------------------------------- */

function escapeHtml(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}


/* --------------------------------------------------
   ANALYZE API
-------------------------------------------------- */

async function analyze() {

    const btn = document.getElementById('analyzeBtn');

    const results = document.getElementById('results');

    btn.disabled = true;

    btn.textContent = 'Analyzing...';

    results.innerHTML =
        '<p style="color: var(--muted)">Compiling and running your snippet in the sandbox...</p>';

    const codeText = document.getElementById('code').value;

    try {

        const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                code: codeText
            })
        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(
                data.message ||
                data.error ||
                'Server returned HTTP ' + res.status
            );
        }

        render(data, codeText);

    } catch (e) {

        results.innerHTML =
            '<pre class="error">Request failed: ' +
            escapeHtml(e.message) +
            '</pre>';

    } finally {

        btn.disabled = false;

        btn.textContent = 'Explain this code';
    }
}


/* --------------------------------------------------
   RENDER SOURCE CODE WITH LINE NUMBERS
-------------------------------------------------- */

function renderCodeView(codeText) {

    const view = document.getElementById('codeView');

    const lines = codeText.split('\n');

    view.innerHTML = lines.map((line, index) => {

        return '<div class="line" id="codeline-' + (index + 1) + '">' +
            '<span class="ln">' + (index + 1) + '</span>' +
            '<span>' + escapeHtml(line) + '</span>' +
            '</div>';

    }).join('');

    document.getElementById('code').style.display = 'none';

    view.style.display = 'block';

    document.getElementById('editBtn').style.display = 'inline-block';
}


/* --------------------------------------------------
   RENDER ANALYSIS RESULT
-------------------------------------------------- */

function render(data, codeText) {

    const results = document.getElementById('results');

    if (!data.valid) {

        results.innerHTML =
            '<pre class="error">' +
            (data.errors || []).map(escapeHtml).join('\n\n') +
            '</pre>';

        document.getElementById('stepControls').style.display = 'none';

        return;
    }

    renderCodeView(codeText);

    currentSteps = Array.isArray(data.steps)
        ? data.steps
        : [];

    currentStepIndex = 0;

    const pipelines =
        Array.isArray(data.pipelines) && data.pipelines.length
            ? data.pipelines
            : [{
                pipelineIndex: 1,
                pipelineSummary: data.pipelineSummary,
                steps: currentSteps
            }];

    let html = '';

    if (data.overallExplanation) {

        html +=
            '<div class="summary">' +
            '<strong>Overall:</strong> ' +
            escapeHtml(data.overallExplanation) +
            '</div>';
    }

    pipelines.forEach((pipeline, pipelinePosition) => {

        const pipelineNumber =
            pipeline.pipelineIndex || (pipelinePosition + 1);

        const summary = pipeline.pipelineSummary || {};

        const steps = Array.isArray(pipeline.steps)
            ? pipeline.steps
            : [];

        html +=
            '<section class="pipeline-section" id="pipeline-' +
            pipelineNumber + '">';

        html +=
            '<div class="pipeline-heading">' +
            '<span>Pipeline ' + pipelineNumber + '</span>' +
            '<span class="pipeline-tag">' +
            steps.length + ' steps</span>' +
            '</div>';

        if (summary.note) {

            html +=
                '<div class="summary">' +
                escapeHtml(summary.note) +
                '</div>';
        }

        if (steps.length) {

            html += '<div class="steps-flow">';

            steps.forEach((step, index) => {

                const globalIndex = currentSteps.findIndex(
                    candidate => candidate.index === step.index
                );

                const navIndex = globalIndex >= 0
                    ? globalIndex
                    : index;

                const isLast = index === steps.length - 1;

                html +=
                    '<div class="step-row" id="steprow-' +
                    navIndex +
                    '" onclick="highlightStep(' +
                    navIndex +
                    ')">';

                html +=
                    '<div class="step-marker">' +
                    '<div class="circle">' +
                    (index + 1) +
                    '</div>' +
                    (isLast ? '' : '<div class="connector"></div>') +
                    '</div>';

                html += '<div class="step-content">';

                html +=
                    '<span class="badge ' +
                    escapeHtml(step.category || '') +
                    '">' +
                    escapeHtml(step.category || '') +
                    '</span>';

                html +=
                    '<span class="op-name">' +
                    escapeHtml(step.operation || '') +
                    '</span>';

                if (step.generalDescription) {

                    html +=
                        '<div class="desc">' +
                        escapeHtml(step.generalDescription) +
                        '</div>';
                }

                if (step.specificDescription) {

                    html +=
                        '<div class="desc">' +
                        escapeHtml(step.specificDescription) +
                        '</div>';
                }

                if (step.friendlyExplanation) {

                    html +=
                        '<div class="friendly">💬 ' +
                        escapeHtml(step.friendlyExplanation) +
                        '</div>';
                }

                if (Array.isArray(step.input)) {

                    html +=
                        '<div class="data-row">' +
                        '<span class="label">in:&nbsp;</span>[' +
                        step.input.map(escapeHtml).join(', ') +
                        ']</div>';
                }

                if (Array.isArray(step.output)) {

                    html +=
                        '<div class="data-row">' +
                        '<span class="label">out:&nbsp;</span>[' +
                        step.output.map(escapeHtml).join(', ') +
                        ']</div>';
                }

                if (
                    step.finalResult !== null &&
                    step.finalResult !== undefined
                ) {

                    html +=
                        '<div class="data-row">' +
                        '<span class="label">result:&nbsp;</span>' +
                        escapeHtml(step.finalResult) +
                        '</div>';
                }

                if (step.diff && step.diff.note) {

                    html +=
                        '<div class="desc">↳ ' +
                        escapeHtml(step.diff.note) +
                        '</div>';
                }

                html += '</div></div>';

            });

            html += '</div>';

        } else {

            html +=
                '<p class="empty-note">' +
                'No steps were returned for this pipeline.' +
                '</p>';
        }

        html += '</section>';

    });

    results.innerHTML = html;

    document.getElementById('stepControls').style.display =
        currentSteps.length ? 'flex' : 'none';

    if (currentSteps.length) {
        highlightStep(0);
    }

    updateStepButtons();
}


/* --------------------------------------------------
   HIGHLIGHT SELECTED STEP
-------------------------------------------------- */

function highlightStep(index) {

    if (index < 0 || index >= currentSteps.length) {
        return;
    }

    currentStepIndex = index;

    // Highlight the selected explanation step.
    document.querySelectorAll('.step-row').forEach(element => {
        element.classList.remove('active');
    });

    const row = document.getElementById('steprow-' + index);

    if (row) {

        row.classList.add('active');

        row.scrollIntoView({
            block: 'nearest',
            behavior: 'smooth'
        });
    }

    // Highlight the matching source-code line.
    document.querySelectorAll('.code-view .line').forEach(element => {
        element.classList.remove('active');
    });

    const line = currentSteps[index].sourceLine;

    if (line) {

        const lineElement =
            document.getElementById('codeline-' + line);

        if (lineElement) {

            lineElement.classList.add('active');

            lineElement.scrollIntoView({
                block: 'center',
                behavior: 'smooth'
            });
        }
    }

    const counter = document.getElementById('stepCounter');

    if (counter) {

        counter.textContent =
            'Step ' + (index + 1) +
            ' of ' + currentSteps.length;
    }

    updateStepButtons();
}


/* --------------------------------------------------
   UPDATE PREVIOUS / NEXT BUTTONS
-------------------------------------------------- */

function updateStepButtons() {

    const prev = document.getElementById('prevStepBtn');

    const next = document.getElementById('nextStepBtn');

    if (prev) {
        prev.disabled = currentStepIndex <= 0;
    }

    if (next) {
        next.disabled =
            currentStepIndex >= currentSteps.length - 1;
    }
}


/* --------------------------------------------------
   STEP NAVIGATION
-------------------------------------------------- */

function prevStep() {

    highlightStep(currentStepIndex - 1);
}

function nextStep() {

    highlightStep(currentStepIndex + 1);
}


/* --------------------------------------------------
   DARK / LIGHT THEME
-------------------------------------------------- */

function applyTheme(theme) {

    const isDark = theme === 'dark';

    document.body.classList.toggle(
        'light-theme',
        !isDark
    );

    document.documentElement.style.colorScheme = theme;

    const toggle = document.getElementById('themeToggle');

    if (toggle) {
        toggle.checked = isDark;
    }
}


function toggleTheme() {

    const toggle = document.getElementById('themeToggle');

    if (!toggle) {
        return;
    }

    const theme = toggle.checked
        ? 'dark'
        : 'light';

    try {

        localStorage.setItem(
            'streamlens-theme',
            theme
        );

    } catch (e) {
        // Theme still changes even if browser storage is unavailable.
    }

    applyTheme(theme);
}


/* --------------------------------------------------
   RESTORE SAVED THEME
-------------------------------------------------- */

// Default theme is dark.
let savedTheme = 'dark';

try {

    savedTheme =
        localStorage.getItem('streamlens-theme') || 'dark';

} catch (e) {
    // Keep default dark theme.
}

applyTheme(savedTheme);

</script>

</body>
</html>

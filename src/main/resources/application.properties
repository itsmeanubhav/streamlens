spring.application.name=streamlens

# Gemini (Google AI Studio) free-tier API key. Get one at https://aistudio.google.com/apikey
# Set as an env var, never commit a real key to git:
#   export GEMINI_API_KEY=xxxx
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash
# Master switch: if false, or if the key is blank, or if the call fails/times out,
# the API still returns the fully verified result - AI is purely additive.
gemini.explanation.enabled=${GEMINI_EXPLANATION_ENABLED:true}

server.port=${PORT:8080}
